<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0d"><title>R-Fit — Entrar</title>
<link rel="stylesheet" href="../../shared/css/rfit.css">
<script type="module" src="../js/login.js"></script>
</head><body><main class="shell login-shell">
<span class="eyebrow">R-FIT V2 · ÁREA DO ALUNO</span>
<h1 class="login-title">Seu próximo<br>nível começa aqui.</h1>
<p>Entre para acompanhar treinos, nutrição e evolução.</p>
<form id="student-login" class="login-form" novalidate>
<label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" placeholder="seu@email.com" required maxlength="254">
<label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Sua senha" required maxlength="128">
<button type="submit" class="primary-button">Entrar no portal</button><p id="login-message" class="form-message" role="status" aria-live="polite"></p>
</form>
<div class="login-divider"><span>ACESSO PROFISSIONAL</span></div>
<a class="secondary-button" href="/auth/google">Entrar com Google (Professor)</a>
<p class="login-footnote">Ambiente em construção. Use somente contas de teste.</p>
</main></body></html>
