<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0d"><title>R-Fit — Login</title>
<link rel="stylesheet" href="../../shared/css/rfit.css">
<script type="module" src="../js/login.js"></script>
</head><body><main class="shell login-shell">
<span class="eyebrow">R-FIT V2 · ACESSO AO PORTAL</span>
<h1 class="login-title">Seu próximo<br>nível começa aqui.</h1>
<p id="login-message-intro">Entre para acessar seu espaço no R-Fit. O sistema direciona você conforme seu perfil.</p><section id="login-featured" class="login-featured" hidden aria-label="Alunos em destaque"><span class="section-kicker">DESTAQUES R-FIT</span><h2>Alunos que inspiram.</h2><div id="login-featured-list" class="login-featured-list"></div></section>
<form id="student-login" class="login-form" novalidate>
<label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" placeholder="seu@email.com" required maxlength="254">
<label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Sua senha" required maxlength="128">
<button type="submit" class="primary-button">Entrar</button><p id="login-message" class="form-message" role="status" aria-live="polite"></p>
</form>
<p class="login-register-link">Ainda não tem conta? <a href="/student/pages/register.html">Criar cadastro</a></p>
<div class="login-divider"><span>OU</span></div>
<a class="secondary-button" href="/auth/google">Entrar com Google</a>
</main></body></html>
