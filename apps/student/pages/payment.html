<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0d"><title>R-Fit — Pagamento</title><link rel="stylesheet" href="/shared/css/rfit.css"><style>
.pay-page{min-height:100vh;padding:24px 16px 48px;background:radial-gradient(ellipse at 80% 0%,#6e0b1e66,transparent 42%),#090a0d;color:#f8f8fb}.pay-wrap{width:min(720px,100%);margin:0 auto}.pay-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.pay-brand{font-size:1.4rem;font-weight:900}.pay-brand b{color:#ff1744;font-size:2rem;margin-right:10px}.pay-panel{background:#f8f8fa;color:#111218;border-radius:24px;padding:clamp(24px,5vw,48px);text-align:center;box-shadow:0 24px 70px #0005}.pay-panel h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.4rem)}.pay-muted{color:#666a77}.pay-methods{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0}.pay-method{border:1px solid #dddde5;border-radius:13px;padding:16px;background:#fff;color:#bc002b;font-weight:900;cursor:pointer}.pay-method.active,.pay-primary{background:linear-gradient(100deg,#ff1744,#c90028);color:white;border-color:#ff1744}.pay-primary{display:block;width:100%;border:0;border-radius:12px;padding:15px;font-weight:900;cursor:pointer}.pay-qr{width:min(250px,100%);margin:18px auto;padding:12px;background:#fff;border-radius:12px}.pay-code{width:100%;min-height:90px;margin:12px 0;padding:12px;border:1px solid #dddde5;border-radius:10px;resize:vertical}.pay-secondary{display:block;width:100%;margin-top:10px;border:1px solid #e0dce1;background:#fff1f3;color:#b60029;border-radius:11px;padding:12px;font-weight:850;cursor:pointer}.pay-message{margin:14px 0 0;font-size:.88rem;color:#5c6070}.pay-message.error{color:#b00020}@media(max-width:480px){.pay-methods{grid-template-columns:1fr}.pay-panel{padding:22px}}
</style></head>
<body class="pay-page"><main class="pay-wrap">
<header class="pay-header"><a class="pay-brand" href="/"><b>R</b>R-Fit</a><a href="/student/pages/login.html">Já sou aluno</a></header>
<section class="pay-panel"><p class="eyebrow">PAGAMENTO SEGURO</p><h1 id="pay-title">Finalize sua assinatura</h1><p id="pay-plan" class="pay-muted">Carregando plano…</p>
<div id="method-picker"><p><strong>Como deseja pagar?</strong></p><div class="pay-methods"><button type="button" class="pay-method active" data-method="pix">⚡ PIX</button><button type="button" class="pay-method" data-method="card">💳 CARTÃO</button></div><button id="start-payment" class="pay-primary">Continuar para pagamento</button></div>
<div id="payment-result" hidden></div><p id="pay-message" class="pay-message" role="status" aria-live="polite"></p>
</section></main><script type="module" src="/student/js/payment.js"></script></body></html>
